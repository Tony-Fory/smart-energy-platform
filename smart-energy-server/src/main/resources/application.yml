server:
  port: ${SERVER_PORT:8080}

# CORS 跨域配置
cors:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

spring:
  application:
    name: smart-energy-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smart_energy}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:smart_energy}
    password: ${MYSQL_PASSWORD:smart_energy123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

tdengine:
  enabled: true
  url: jdbc:TAOS-RS://${TDENGINE_HOST:localhost}:${TDENGINE_REST_PORT:6041}/${TDENGINE_DATABASE:smart_energy}
  username: ${TDENGINE_USER:root}
  password: ${TDENGINE_PASSWORD:taosdata}
  driver-class-name: com.taosdata.jdbc.rs.RestfulDriver

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
